name: Validate and build Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: habit-garden-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Domain tests and source validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile domain and run NUnit tests
        run: dotnet test Tools/DomainTests/HabitGarden.DomainTests.csproj --configuration Release --logger trx --results-directory artifacts/domain
      - name: Install syntax parsers
        run: python3 -m pip install -r Tools/validation-requirements.txt
      - name: Check source and project metadata
        run: |
          python3 Tools/validate-source.py
          bash -n Tools/build-android.sh
          git diff --check
      - name: Save domain test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: domain-test-results
          path: artifacts/domain
          if-no-files-found: warn

  configuration:
    name: Unity build configuration
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.license.outputs.ready }}
    steps:
      - name: Check required Unity configuration without exposing secrets
        id: license
        env:
          HG_UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          HG_UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          HG_UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$HG_UNITY_LICENSE" && -n "$HG_UNITY_EMAIL" && -n "$HG_UNITY_PASSWORD" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Unity configuration is present.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '### APK build needs Unity activation' >> "$GITHUB_STEP_SUMMARY"
            echo 'Configure UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD in repository Actions secrets following docs/CI_BUILD.md. Never paste these values into chat or commit them.' >> "$GITHUB_STEP_SUMMARY"
            echo 'Source validation still runs. Unity tests and the APK build are skipped until activation is configured.' >> "$GITHUB_STEP_SUMMARY"
          fi

  unity-tests:
    name: Unity EditMode tests
    needs: [source, configuration]
    if: needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run all Unity tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.26f1
          testMode: editmode
          artifactsPath: artifacts/unity-tests
          coverageEnabled: false
      - name: Save Unity results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-test-results
          path: artifacts/unity-tests
          if-no-files-found: warn

  apk:
    name: Build Android test APK
    needs: unity-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build ARM64 Android APK
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.26f1
          targetPlatform: Android
          buildMethod: HabitGarden.Editor.ProjectSetup.BuildApk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HabitGarden-test-apk
          path: Builds/HabitGarden-test.apk
          if-no-files-found: error
